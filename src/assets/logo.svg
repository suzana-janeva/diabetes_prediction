<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- LOGO ICON GROUP -->
  <g transform="translate(0, -20)">
    <!-- Outer Glowing Tech Ring (Purple/Lavender) -->
    <circle cx="250" cy="220" r="100" fill="none" stroke="#6c5ce7" stroke-width="8" stroke-dasharray="12 8" opacity="0.4"/>
    <circle cx="250" cy="220" r="100" fill="none" stroke="#a29bfe" stroke-width="4" stroke-dasharray="80 40 10 40"/>

    <!-- Concentric Inner Ring -->
    <circle cx="250" cy="220" r="75" fill="none" stroke="#251a40" stroke-width="3"/>

    <!-- Circuit Node Details -->
    <circle cx="250" cy="120" r="6" fill="#ff4081"/>
    <circle cx="350" cy="220" r="6" fill="#6c5ce7"/>
    <circle cx="150" cy="220" r="4" fill="#a29bfe"/>

    <!-- Central Blood Drop Icon (Vibrant Pink/Magenta) -->
    <path d="M 250,140 C 215,190 190,220 190,245 A 60,60 0 0,0 310,245 C 310,220 285,190 250,140 Z"
          fill="#ff4081"
          filter="drop-shadow(0px 8px 16px rgba(255, 64, 129, 0.45))"/>

    <!-- Abstract Inner Gloss Reflection on the Drop -->
    <path d="M 235,165 C 220,195 210,215 210,235 A 40,40 0 0,0 230,272"
          fill="none"
          stroke="#ffffff"
          stroke-width="4"
          stroke-linecap="round"
          opacity="0.3"/>
  </g>
</svg>
